# Paths are relative to the repo root, so always run dbt from there.
secop_ledger:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('SECOP_WAREHOUSE_PATH', 'data/warehouse.duckdb') }}"
      threads: 1  # dbt models built at the same time (small shared PC)
      settings:
        # Same limits as silver (src/secop_ledger/silver/db.py).
        memory_limit: "{{ env_var('SECOP_DUCKDB_MEMORY_LIMIT', '2GB') }}"
        threads: "{{ env_var('SECOP_DUCKDB_THREADS', '2') }}"
        # No temp_directory here: dbt-duckdb applies settings again on every connection, and DuckDB
        # can't change it after it has spilled. The default (<warehouse>.tmp, inside data/) is fine.
        preserve_insertion_order: false
