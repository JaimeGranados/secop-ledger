version: 2

models:
  - name: stg_contract_changes
    description: Change events from silver, with the tracked values as columns.
    columns:
      - name: id_contrato
        data_tests:
          - not_null
      - name: ingest_date
        data_tests:
          - not_null
      - name: change_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["baseline", "new", "changed", "disappeared"]
